name: Build macOS App

# Replaces a stale JavaFX/Maven workflow that referenced a pom.xml and an
# EncodeForge/ subdirectory which no longer exist — it failed at the mvn step on
# every run. This drives packaging/macos/build-release-macos.sh, the script that
# actually produces the current PySide6 app bundle.
#
# Signing and notarisation are skipped unless the corresponding secrets are set;
# the script already degrades gracefully when notarytool is unconfigured.

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS (Nuitka .app + DMG)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest pytest-mock
          pytest -m "not integration and not requires_network and not requires_ffmpeg" -q

      - name: Build app bundle and DMG
        env:
          # An empty identity makes sign-macos-app.sh fall back to ad-hoc
          # signing, which is enough for CI artifacts.
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: bash packaging/macos/build-release-macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: encodeforge-macos-${{ github.run_number }}
          path: |
            dist-packages/*.dmg
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### macOS build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- DMG: artifact encodeforge-macos-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

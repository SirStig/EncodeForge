name: Deploy GitHub Pages

on:
  push:
    branches:
      # Must match this repo's actual default branch (currently "0.5.0" —
      # there is no "main" branch here). This trigger was pointed at "main"
      # for months while all work happened on "0.5.0", so it silently never
      # fired on a normal push; only a manual workflow_dispatch could deploy.
      # If the default branch is renamed/promoted later, update this too.
      - 0.5.0
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      
      - name: Build site
        run: |
          echo "Preparing GitHub Pages site..."
          mkdir -p _site
          cp -r docs/* _site/ || true
          
          # Copy screenshots if they exist
          if [ -d "screenshots" ]; then
            mkdir -p _site/screenshots
            cp screenshots/* _site/screenshots/
          fi
          
          cp CHANGELOG.md _site/changelog.md
          
          echo "Site build complete"
          ls -la _site/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

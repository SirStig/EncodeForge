[pytest]
testpaths = tests
python_files = test_*.py
markers =
    requires_ffprobe: needs ffprobe on PATH (optional integration-style check)
    integration: hits FFmpeg, network, or optional Whisper; run with pytest -m integration
    requires_ffmpeg: needs ffmpeg and ffprobe on PATH
    requires_network: downloads or calls external HTTP APIs
    requires_whisper: needs faster-whisper installed and at least one cached model
    slow: long-running (e.g. transcoding, Whisper)
    stress_subtitles: set ENCODEFORGE_STRESS_SUBTITLES=1 for multi-provider auto-download stress test
    advanced_subtitle_search: set ENCODEFORGE_ADVANCED_SUBTITLE_SEARCH=1 for slow advanced_search_subtitles test
